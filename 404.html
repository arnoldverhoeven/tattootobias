<head>

<style>
:root{--ink:#121212;--paper:#efe6d3;--red:#BB3431;--green:#507C76;--r:6px}

p.eyebrow{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:14px}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:1.05;font-size:clamp(44px,9vw,96px);margin-bottom:20px}
h1 span{color:var(--red)}
p{margin-bottom:28px;opacity:.85}
.btns{display:flex;gap:12px;flex-wrap:wrap}
a.btn{display:inline-flex;align-items:center;min-height:52px;padding:0 26px;border-radius:var(--r);background:var(--red);color:#fff;text-decoration:none;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px;border:2px solid var(--red)}
a.ghost{background:transparent;color:inherit;border-color:currentColor}
</style>
</head>
<body>
<main>
  <p class="eyebrow">★ Tattoo Tobias · Antwerp</p>

</main>
</body>
</html>
